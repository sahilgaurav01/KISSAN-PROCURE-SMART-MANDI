<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • KisanProcure (SIH 26032)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-2xl space-y-6">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-emerald-600 rounded-2xl mx-auto flex items-center justify-center text-white shadow-lg shadow-emerald-600/30">
        <i data-lucide="sprout" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Kisan<span class="text-emerald-600">Procure</span></h1>
      <p class="text-xs text-slate-500">Sign in to your Mandi Procurement Account</p>
    </div>

    <!-- Phone & OTP Input Form -->
    <form onsubmit="handleLoginSubmit(event)" id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mobile Number / Farmer ID</label>
        <div class="relative">
          <span class="absolute left-3.5 top-3 text-xs font-bold text-slate-400">+91</span>
          <input type="tel" id="login-phone" value="9876543210" required maxlength="10" placeholder="Enter 10-digit mobile number" class="w-full pl-12 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold text-slate-900 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20" />
        </div>
        <span class="text-[10px] text-slate-400 block mt-1">Default test phone: <strong class="text-emerald-700">9876543210</strong> (Ramesh Kumar)</span>
      </div>

      <div id="otp-container" class="hidden space-y-1.5">
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Enter OTP Code</label>
        <input type="text" id="login-otp" value="123456" maxlength="6" placeholder="Enter 6-digit OTP" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-mono font-bold text-slate-900 tracking-widest text-center outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20" />
        <span class="text-[10px] text-emerald-600 font-semibold block">✓ Auto-filled demo OTP: 123456</span>
      </div>

      <button type="submit" id="login-submit-btn" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition shadow-lg shadow-emerald-600/25 flex items-center justify-center space-x-2">
        <span>Send OTP & Sign In</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- 1-Click Fast Persona Switcher -->
    <div class="pt-4 border-t border-slate-100 space-y-3">
      <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block text-center">Or 1-Click Demo Persona</span>

      <div class="space-y-2">
        <button onclick="quickLogin('farmer')" class="w-full p-2.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-950 font-bold text-xs flex items-center justify-between transition">
          <div class="flex items-center space-x-2">
            <span>👨‍🌾</span>
            <div class="text-left">
              <div>Farmer Ramesh Kumar</div>
              <div class="text-[10px] text-emerald-700 font-normal">FARM1001 • Token #23</div>
            </div>
          </div>
          <span class="text-[10px] bg-emerald-200 text-emerald-900 px-2 py-0.5 rounded font-mono font-bold">LOGIN &rarr;</span>
        </button>

        <button onclick="quickLogin('officer')" class="w-full p-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-950 font-bold text-xs flex items-center justify-between transition">
          <div class="flex items-center space-x-2">
            <span>👮</span>
            <div class="text-left">
              <div>Officer Rajesh Sharma</div>
              <div class="text-[10px] text-amber-700 font-normal">Inspector • Mandi Desk 1</div>
            </div>
          </div>
          <span class="text-[10px] bg-amber-200 text-amber-900 px-2 py-0.5 rounded font-mono font-bold">LOGIN &rarr;</span>
        </button>

        <button onclick="quickLogin('admin')" class="w-full p-2.5 rounded-xl bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-950 font-bold text-xs flex items-center justify-between transition">
          <div class="flex items-center space-x-2">
            <span>🏛️</span>
            <div class="text-left">
              <div>Director Dr. Sanjay Meena</div>
              <div class="text-[10px] text-blue-700 font-normal">State Procurement & DBT</div>
            </div>
          </div>
          <span class="text-[10px] bg-blue-200 text-blue-900 px-2 py-0.5 rounded font-mono font-bold">LOGIN &rarr;</span>
        </button>
      </div>
    </div>

    <!-- Back to Home -->
    <div class="text-center pt-2">
      <a href="../index.html" class="text-xs text-slate-400 hover:text-slate-700 font-semibold inline-flex items-center space-x-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Back to Portal Home</span>
      </a>
    </div>

  </div>

  <script type="module">
    import { AuthService } from '../js/supabase/auth.js';

    let isOtpSent = false;

    window.handleLoginSubmit = (e) => {
      e.preventDefault();
      const phone = document.getElementById('login-phone').value.trim();
      const otpContainer = document.getElementById('otp-container');
      const submitBtn = document.getElementById('login-submit-btn');

      if (!isOtpSent) {
        isOtpSent = true;
        otpContainer.classList.remove('hidden');
        submitBtn.innerHTML = '<span>Verify OTP & Open Dashboard</span><i data-lucide="check" class="w-4 h-4"></i>';
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      // Determine role from phone
      let role = 'farmer';
      if (phone === '9876543200') role = 'officer';
      else if (phone === '9876543201') role = 'admin';

      AuthService.loginAsPersona(role);
      window.location.href = '../index.html';
    };

    window.quickLogin = (role) => {
      AuthService.loginAsPersona(role);
      window.location.href = '../index.html';
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
