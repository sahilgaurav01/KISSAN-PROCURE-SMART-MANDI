<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Portal • KisanProcure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <header class="bg-white border-b border-slate-200 py-3 px-6 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <a href="../index.html" class="flex items-center space-x-2">
        <span class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white"><i data-lucide="sprout" class="w-5 h-5"></i></span>
        <span class="font-black text-lg">Kisan<span class="text-emerald-600">Procure</span></span>
      </a>
    </div>
    <div class="flex items-center space-x-3 text-xs">
      <span class="font-bold">Ramesh Kumar (FARM1001)</span>
      <a href="../index.html" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold">Home</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-6 flex-1 w-full">
    <div class="bg-emerald-800 text-white p-6 rounded-3xl flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">Farmer Dashboard</h1>
        <p class="text-xs text-emerald-200 mt-1">Village: Minapur • Muzaffarpur Mandi (PC-MUZ-01)</p>
      </div>
      <div class="flex space-x-2">
        <a href="booking.html" class="px-4 py-2 rounded-xl bg-amber-400 text-slate-950 font-bold text-xs">Book Slot</a>
        <a href="queue.html" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold text-xs border border-emerald-400">Live Queue</a>
      </div>
    </div>

    <!-- Active Token Spotlight -->
    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
      <div class="p-3 bg-slate-50 rounded-xl">
        <span class="text-xs text-slate-500">Mandi</span>
        <span class="font-bold text-slate-800 block text-sm mt-1">Muzaffarpur</span>
      </div>
      <div class="p-3 bg-slate-50 rounded-xl">
        <span class="text-xs text-slate-500">Slot</span>
        <span class="font-bold text-slate-800 block text-sm mt-1">10:00 - 11:00 AM</span>
      </div>
      <div class="p-3 bg-slate-50 rounded-xl">
        <span class="text-xs text-slate-500">Declared Crop</span>
        <span class="font-bold text-emerald-700 block text-sm mt-1">40 Qtl Wheat</span>
      </div>
      <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200">
        <span class="text-xs text-emerald-700 font-bold">Your Token</span>
        <span class="text-2xl font-black text-emerald-900 block mt-0.5">#23</span>
      </div>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
