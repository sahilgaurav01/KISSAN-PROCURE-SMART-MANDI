<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Queue Display • KisanProcure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col p-6">
  <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-8">
    <div class="flex items-center space-x-3">
      <span class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></span>
      <h1 class="text-xl font-bold">Muzaffarpur Central Mandi (Live Display)</h1>
    </div>
    <a href="../index.html" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-200 border border-slate-700">Back to App</a>
  </header>

  <main class="max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-8 my-auto text-center">
    <div class="bg-slate-900 border-2 border-amber-500/50 p-8 rounded-3xl shadow-2xl">
      <span class="text-xs font-bold text-amber-400 uppercase tracking-widest block mb-2">CURRENT SERVING TOKEN</span>
      <div class="text-7xl font-black font-mono text-amber-400 my-4 animate-pulse">#18</div>
      <div class="text-sm font-semibold text-white">Manoj Paswan (Wheat • 45 Qtl)</div>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">
      <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest block mb-2">NEXT IN LINE</span>
      <div class="text-7xl font-black font-mono text-emerald-400 my-4">#19</div>
      <div class="text-sm font-semibold text-slate-300">Suresh Singh</div>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
